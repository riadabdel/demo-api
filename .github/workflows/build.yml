name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  docker:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout app
      uses: actions/checkout@v4


    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          felfelharr/demo-api:${{ github.sha }}


    - name: Checkout GitOps repo
      uses: actions/checkout@v4
      with:
        repository: riadabdel/k8s-platform
        ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
        path: k8s-platform


    - name: Update image tag
      run: |
        cd k8s-platform/overlays/dev

        kustomize edit set image \
        felfelharr/k8s-demo-api=felfelharr/k8s-demo-api:${{ github.sha }}


    - name: Commit GitOps change
      run: |
        cd k8s-platform

        git config user.name github-actions
        git config user.email actions@github.com

        git add .
        git commit -m "Deploy demo-api ${{ github.sha }}"
        git push
